        const convertUrlToBase64 = async (url) => {
            if (!url) return null;
            if (url.startsWith('data:') || url.startsWith('blob:')) return url;
            const fetchImage = async (targetUrl) => {
                const response = await fetch(targetUrl, { mode: 'cors' });
                if (!response.ok) throw new Error('Error de red');
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            };
            try { return await fetchImage(url); } catch (e1) {
                try { return await fetchImage(`https://corsproxy.io/?${encodeURIComponent(url)}`); } catch (e2) {
                    try { return await fetchImage(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`); } catch (e3) {
                        return url;
                    }
                }
            }
        };

        const waitForAllImages = async (root) => {
            const images = Array.from(root.querySelectorAll('img'));
            await Promise.all(images.map(img => {
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                return new Promise(resolve => {
                    const done = () => resolve();
                    img.addEventListener('load', done, { once: true });
                    img.addEventListener('error', done, { once: true });
                });
            }));
        };

        const dataUrlToBlob = (dataUrl) => {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        };

        const downloadBlob = async (blob, filename) => {
            const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;
            const blobUrl = URL.createObjectURL(blob);

            try {
                if (isMobileDevice && navigator.share && window.File) {
                    const file = new File([blob], filename, { type: blob.type || 'image/png' });
                    if (!navigator.canShare || navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: filename, text: 'Gráfica generada desde la app' });
                        setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
                        return;
                    }
                }
            } catch (shareError) {
                console.warn('Compartir en móvil no disponible, se intentará descarga directa.', shareError);
            }

            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename;
            link.rel = 'noopener';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            if (isMobileDevice) {
                setTimeout(() => {
                    if (document.visibilityState === 'visible') {
                        window.open(blobUrl, '_blank', 'noopener,noreferrer');
                    }
                }, 180);
            }

            setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
        };

        const readFileAsDataUrl = (file) => new Promise((resolve, reject) => {

            reader.onerror = reject;
            reader.readAsDataURL(file);
        });

        const CorsImg = ({ src, alt, className, style }) => {
            const [imgSrc, setImgSrc] = useState(src);
            useEffect(() => {
                setImgSrc(src);
                if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;
                let isActive = true;
                const convert = async () => {
                    const safeBase64 = await convertUrlToBase64(src);
                    if (isActive && safeBase64) setImgSrc(safeBase64);
                };
                convert();
                return () => { isActive = false; };
            }, [src]);

            return <img src={imgSrc} alt={alt} className={className} style={style} crossOrigin="anonymous" draggable="false" />;
        };

            if (len <= 14) return 'text-[4.5rem]';
            if (len <= 18) return 'text-[3.5rem]';
            return 'text-[2.5rem]';

        const getSafeTextBlendMode = (mode) => {
            const directModes = new Set([
                'normal', 'multiply', 'screen', 'overlay', 'soft-light', 'hard-light',
                'lighten', 'darken', 'color-dodge', 'color-burn', 'difference', 'exclusion'
            ]);
            if (directModes.has(mode)) return mode;
            const fallbackMap = {
                color: 'overlay',
                hue: 'hard-light',
                saturation: 'soft-light',
                luminosity: 'screen'
            };
            return fallbackMap[mode] || 'normal';
        };

        const getBlendTextStyle = ({ mode, color, hollow = false, shadow = '0 15px 30px rgba(0,0,0,0.9)', opacity }) => ({

            WebkitTextStroke: hollow ? `3px ${color}` : '0px transparent',
            textShadow: shadow,
            mixBlendMode: getSafeTextBlendMode(mode),
            willChange: 'transform, opacity, filter',
            transform: 'translateZ(0)',
            isolation: 'auto',
            opacity: opacity ?? (mode === 'screen' || mode === 'color-dodge' ? 0.96 : 0.99),

        const getFusedTextFillStyle = ({ color, hollow = false, shadow = "0 15px 30px rgba(0,0,0,0.9)" }) => {

            return {
                ...baseStyle,
                color: hollow ? 'transparent' : color,
                WebkitTextStroke: hollow ? `3px ${color}` : '0px transparent'

        };

                                                    <div className="flex items-center gap-2">
                                                        <span className="text-[10px] text-slate-400 w-24">Y Texto 2</span>
                                                        <input type="range" min="250" max="980" step="1" value={data.hjTextY2 ?? 722} onChange={(e) => handleInputChange('hjTextY2', parseInt(e.target.value, 10))} className="w-full" />
                                                        <input type="number" value={data.hjTextY2 ?? 722} onChange={(e) => handleInputChange('hjTextY2', parseInt(e.target.value || '722', 10))} className="w-20 bg-slate-800 p-1 rounded text-[10px] text-center font-bold" />
                                                    </div>
                                                </div>

                                                <div className="flex items-center gap-2 mt-1"><input type="text" value={data.hjTextLine1} onChange={(e) => handleInputChange('hjTextLine1', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-xs text-center font-bold" /><input type="color" value={data.hjTextColor1} onChange={(e) => handleInputChange('hjTextColor1', e.target.value)} className="w-6 h-6 rounded border-none p-0 cursor-pointer bg-transparent" /><button onClick={() => handleInputChange('hjTextHollow1', !data.hjTextHollow1)} className="bg-slate-700 text-[9px] p-1 rounded font-bold">{data.hjTextHollow1 ? 'HUECO' : 'SÓLIDO'}</button></div>
                                                <select value={data.hjTextBlendMode1} onChange={(e) => handleInputChange('hjTextBlendMode1', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-[10px]">{BLEND_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>Fusión HOY JUEGA: {opt.label}</option>)}</select>
                                                <div className="flex items-center gap-2 mt-1"><input type="text" value={data.hjTextLine2} onChange={(e) => handleInputChange('hjTextLine2', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-xs text-center font-bold" /><input type="color" value={data.hjTextColor2} onChange={(e) => handleInputChange('hjTextColor2', e.target.value)} className="w-6 h-6 rounded border-none p-0 cursor-pointer bg-transparent" /><button onClick={() => handleInputChange('hjTextHollow2', !data.hjTextHollow2)} className="bg-slate-700 text-[9px] p-1 rounded font-bold">{data.hjTextHollow2 ? 'HUECO' : 'SÓLIDO'}</button></div>
                                                <select value={data.hjTextBlendMode2} onChange={(e) => handleInputChange('hjTextBlendMode2', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-[10px]">{BLEND_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>Fusión TALLERES: {opt.label}</option>)}</select>
                                            </div>
                                        )}

                                        <div className="bg-slate-700/30 p-2 rounded space-y-2 mb-4 border border-slate-600"><label className="text-xs font-bold text-blue-300">Posición de Escudos/Cinta</label><div className="flex gap-2"><select value={data.hjLogosPosX} onChange={(e) => handleInputChange('hjLogosPosX', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-xs text-center font-bold"><option value="right">Derecha</option><option value="left">Izquierda</option></select></div></div>
                                        <div className="bg-slate-800 p-2 rounded space-y-2 border border-slate-600"><label className="text-xs font-bold text-slate-400 flex justify-between items-center">INFO CENTRAL <Trophy size={12}/></label>{activeTemplate === TEMPLATES.RESULTADO_FINAL && <button onClick={applyLastFirstDivisionPreset} className="w-full bg-blue-600 hover:bg-blue-500 rounded py-2 text-[10px] font-bold">CARGAR ÚLTIMO RESULTADO</button>}<select className="w-full bg-slate-900 p-1 rounded text-[10px]" onChange={(e) => handleTournamentChange(e.target.value)}><option value="">Cambiar Torneo...</option>{LEAGUES_DB.map((l, i) => <option key={i} value={l.url}>{l.name}</option>)}</select>{activeTemplate === TEMPLATES.RESULTADO_FINAL && <div className="flex gap-2 mt-2"><input type="text" value={data.resScore1} onChange={(e) => handleInputChange('resScore1', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-lg text-center font-bold font-talleres" placeholder="Goles Eq 1" /><input type="text" value={data.resScore2} onChange={(e) => handleInputChange('resScore2', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-lg text-center font-bold font-talleres" placeholder="Goles Eq 2" /></div>}</div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-700/30 p-2 rounded space-y-2"><label className="text-[10px] font-bold text-blue-300 uppercase">EQUIPO 1 {activeTemplate === TEMPLATES.HOY_JUEGA || activeTemplate === TEMPLATES.RESULTADO_FINAL ? '(ARRIBA)' : ''}</label><select className="w-full bg-slate-900 p-1 rounded text-[10px]" onChange={(e) => handleTeamChange(1, e.target.value)}><option value="">Cambiar Escudo...</option>{TEAMS_DB.map((t, i) => <option key={i} value={t.url}>{t.name}</option>)}</select><div className="flex items-center justify-between gap-1 mt-1"><span className="text-[9px]">Grad:</span><input type="color" value={data.resColor1A} onChange={(e) => handleInputChange('resColor1A', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Superior" /><input type="color" value={data.resColor1B} onChange={(e) => handleInputChange('resColor1B', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Medio" /><input type="color" value={data.resColor1C} onChange={(e) => handleInputChange('resColor1C', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Inferior" /></div>{activeTemplate !== TEMPLATES.HOY_JUEGA && <input type="text" value={data.resTeam1Name} onChange={(e) => handleInputChange('resTeam1Name', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-xs font-bold uppercase mt-2" placeholder="Nombre" />}</div>
                                            <div className="bg-slate-700/30 p-2 rounded space-y-2"><label className="text-[10px] font-bold text-red-300 uppercase">EQUIPO 2 {activeTemplate === TEMPLATES.HOY_JUEGA || activeTemplate === TEMPLATES.RESULTADO_FINAL ? '(ABAJO)' : ''}</label><select className="w-full bg-slate-900 p-1 rounded text-[10px]" onChange={(e) => handleTeamChange(2, e.target.value)}><option value="">Cambiar Escudo...</option>{TEAMS_DB.map((t, i) => <option key={i} value={t.url}>{t.name}</option>)}</select><div className="flex items-center justify-between gap-1 mt-1"><span className="text-[9px]">Grad:</span><input type="color" value={data.resColor2A} onChange={(e) => handleInputChange('resColor2A', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Superior" /><input type="color" value={data.resColor2B} onChange={(e) => handleInputChange('resColor2B', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Medio" /><input type="color" value={data.resColor2C} onChange={(e) => handleInputChange('resColor2C', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Inferior" /></div>{activeTemplate !== TEMPLATES.HOY_JUEGA && <input type="text" value={data.resTeam2Name} onChange={(e) => handleInputChange('resTeam2Name', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-xs font-bold uppercase mt-2" placeholder="Nombre" />}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <div ref={containerRef} className={`flex-1 flex items-center justify-center relative transition-all duration-300 ${isPreviewMode ? 'fixed inset-0 z-50 bg-black' : 'bg-slate-950/50 p-2 md:p-4 overflow-auto'}`} onPaste={handleGlobalPaste} tabIndex="0">
                        <div className="absolute top-4 right-4 z-50 flex gap-2"><button onClick={() => setIsPreviewMode(!isPreviewMode)} className="bg-black/50 hover:bg-blue-600 text-white p-3 rounded-full backdrop-blur-md transition-all shadow-lg border border-white/20">{isPreviewMode ? <Minimize2 size={24} /> : <Eye size={24} />}</button></div>
                        <div ref={wrapperRef} style={{ transform: isPreviewMode ? `scale(${Math.min(window.innerWidth / 1080, window.innerHeight / 1350) * 0.95})` : `scale(${previewScale})`, transformOrigin: 'center' }} className="shadow-2xl">
                            <div ref={canvasRef} style={{ width: '1080px', height: '1350px', backgroundColor: THEME.bg }} className="overflow-hidden shadow-2xl relative bg-[#021024]">{renderActiveTemplate()}</div>
                        </div>
                        {!isPreviewMode && <button onClick={handleDownload} disabled={loading} className="absolute bottom-6 right-6 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 z-30 transition-transform hover:scale-105 active:scale-95">{loading ? 'PROCESANDO...' : <><Download size={20} /> DESCARGAR HD</>}</button>}
                        {isPreviewMode && <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex gap-4 z-50"><button onClick={handleDownload} disabled={loading} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-full font-bold shadow-2xl flex items-center gap-3 transition-transform hover:scale-105 active:scale-95 border-2 border-white/20">{loading ? 'GENERANDO...' : <><Save size={24} /> GUARDAR IMAGEN</>}</button></div>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
