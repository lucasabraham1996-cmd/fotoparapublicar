        const convertUrlToBase64 = async (url) => {
            if (!url) return null;
            if (url.startsWith('data:') || url.startsWith('blob:')) return url;
            const fetchImage = async (targetUrl) => {
                const response = await fetch(targetUrl, { mode: 'cors' });
                if (!response.ok) throw new Error('Error de red');
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            };
            try { return await fetchImage(url); } catch (e1) {
                try { return await fetchImage(`https://corsproxy.io/?${encodeURIComponent(url)}`); } catch (e2) {
                    try { return await fetchImage(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`); } catch (e3) {
                        return url;
                    }
                }
            }
        };

        const waitForAllImages = async (root) => {
            const images = Array.from(root.querySelectorAll('img'));
            await Promise.all(images.map(img => {
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                return new Promise(resolve => {
                    const done = () => resolve();
                    img.addEventListener('load', done, { once: true });
                    img.addEventListener('error', done, { once: true });
                });
            }));
        };

        const dataUrlToBlob = (dataUrl) => {
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
        };

        const resizeBlobIfNeeded = async (blob, maxWidth = 960, maxHeight = 1200) => {
            const imgUrl = URL.createObjectURL(blob);
            try {
                const img = await new Promise((resolve, reject) => {
                    const instance = new Image();
                    instance.onload = () => resolve(instance);
                    instance.onerror = reject;
                    instance.src = imgUrl;
                });
                const ratio = Math.min(maxWidth / img.width, maxHeight / img.height, 1);
                if (ratio >= 0.999) return blob;
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * ratio);
                canvas.height = Math.round(img.height * ratio);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                return await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.96));
            } finally {
                URL.revokeObjectURL(imgUrl);
            }
        };

        const downloadBlob = (blob, filename) => {
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
        };

        const CorsImg = ({ src, alt, className, style }) => {

            useEffect(() => {
                setImgSrc(src);
                if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;
                let isActive = true;
                const convert = async () => {
                    const safeBase64 = await convertUrlToBase64(src);
                    if (isActive && safeBase64) setImgSrc(safeBase64);
                };
                convert();
                return () => { isActive = false; };
            }, [src]);

            return <img src={imgSrc} alt={alt} className={className} style={style} crossOrigin="anonymous" draggable="false" />;
        };

        const getSafeTextBlendMode = (mode) => {
            const directModes = new Set([
                'normal', 'multiply', 'screen', 'overlay', 'soft-light', 'hard-light',
                'lighten', 'darken', 'color-dodge', 'color-burn', 'difference', 'exclusion'
            ]);
            if (directModes.has(mode)) return mode;
            const fallbackMap = {
                color: 'overlay',
                hue: 'hard-light',
                saturation: 'soft-light',
                luminosity: 'screen'
            };
            return fallbackMap[mode] || 'normal';
        };

                    for (const clipboardItem of clipboardItems) {
                        const imageTypes = clipboardItem.types.filter(type => type.startsWith('image/'));
                        if (imageTypes.length > 0) {
                            const blob = await clipboardItem.getType(imageTypes[0]);
                            const dataUrl = await readFileAsDataUrl(blob);
                            applyImageToCanvas(dataUrl);
                            foundImage = true;
                            break;

                    if (!foundImage) alert('No se encontró imagen copiada.');

                    await new Promise(resolve => setTimeout(resolve, 120));

                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;
                    const fileName = `grafica-${activeTemplate}-${Date.now()}.png`;
                    let blob = null;

                    const commonStyle = {
                        margin: '0',
                        transform: 'none',
                        transformOrigin: 'center',
                        width: '1080px',
                        height: '1350px'
                    };

                    if (window.htmlToImage && !isMobile) {
                        try {
                            blob = await window.htmlToImage.toBlob(canvasRef.current, {
                                cacheBust: true,
                                pixelRatio: 2.0,
                                backgroundColor: THEME.bg,
                                style: commonStyle,
                                skipAutoScale: true,
                                includeQueryParams: true
                            });
                        } catch (e) {
                            console.warn('html-to-image desktop falló:', e);
                        }
                    }

                    if (!blob && window.html2canvas) {
                        const canvas = await window.html2canvas(canvasRef.current, {
                            scale: isMobile ? 1.6 : 2.0,
                            useCORS: true,
                            allowTaint: false,
                            backgroundColor: THEME.bg,
                            imageTimeout: 0,
                            logging: false,
                            removeContainer: true,
                            foreignObjectRendering: false,
                            onclone: (doc) => {
                                const clonedRoot = doc.querySelector('#root');
                                if (clonedRoot) {
                                    const imgs = clonedRoot.querySelectorAll('img');
                                    imgs.forEach(img => {
                                        img.setAttribute('crossorigin', 'anonymous');
                                        img.style.imageRendering = 'auto';
                                    });
                                }
                            }
                        });
                        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1));
                    }

                    if (!blob && window.htmlToImage) {
                        const dataUrl = await window.htmlToImage.toPng(canvasRef.current, {
                            cacheBust: true,
                            pixelRatio: isMobile ? 1.5 : 1.75,
                            backgroundColor: THEME.bg,
                            style: commonStyle,
                            skipAutoScale: true,
                            includeQueryParams: true
                        });
                        blob = dataUrlToBlob(dataUrl);
                    }

                    if (!blob) throw new Error('No se pudo generar la imagen.');
                    wrapperRef.current.style.transform = originalTransform;
                    blob = await resizeBlobIfNeeded(blob, 960, 1200);
                    downloadBlob(blob, fileName);

                    console.error('Error capturando:', err);
                    alert('Error al descargar. Probá nuevamente y, si estás en móvil, usá Chrome actualizado.');

                const safeId = textValue.replace(/[^a-zA-Z0-9]/g, '') || 'TEXT';
                const patternId = `fusion-${safeId}-${fontSize}-${blendMode}-${hollow ? 'h' : 's'}`;

                const shadowY = Math.max(8, Math.round(fontSize * 0.055));
                const shadowBlur = Math.max(8, Math.round(fontSize * 0.04));
                const solidStrokeWidth = Math.max(4, Math.round(fontSize * 0.028));

                const mainStrokeWidth = hollow ? hollowStrokeWidth : (fused ? solidStrokeWidth : Math.max(3, Math.round(fontSize * 0.02)));
                const fillValue = hollow ? 'transparent' : (fused ? `url(#${patternId})` : fallbackColor);
                const strokeValue = fused ? `url(#${patternId})` : fallbackColor;

                return (
                    <svg className="absolute inset-0 w-full h-full overflow-visible" viewBox="0 0 1080 1350" preserveAspectRatio="none">

                            letterSpacing={letterSpacing}

                                {(activeTemplate === TEMPLATES.CONVOCADOS || activeTemplate === TEMPLATES.FORMACION) && (
                                    <div className="space-y-4">
                                        <div className="bg-slate-700/30 p-2 rounded space-y-2 border border-slate-600"><label className="text-xs font-bold text-blue-300">INFO DEL PARTIDO</label><div className="flex gap-2"><input type="date" value={data.matchDate} onChange={(e) => handleInputChange('matchDate', e.target.value)} className="w-1/2 bg-slate-900 p-2 rounded text-xs" /><input type="time" value={data.matchTime} onChange={(e) => handleInputChange('matchTime', e.target.value)} className="w-1/2 bg-slate-900 p-2 rounded text-xs" /></div><input type="text" value={data.matchStadium} onChange={(e) => handleInputChange('matchStadium', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-xs" placeholder="Estadio (Ej: KEMPES)" />{activeTemplate === TEMPLATES.CONVOCADOS && <input type="text" value={data.rivalName} onChange={(e) => handleInputChange('rivalName', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-xs mt-2" placeholder="Nombre Rival" />}<input type="text" value={data.dtName} onChange={(e) => handleInputChange('dtName', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-xs mt-2" placeholder="Nombre DT" /></div>
                                        <div><div className="flex justify-between items-center mb-2"><label className="text-xs font-bold text-slate-400">SELECCIONAR JUGADORES</label><span className="text-[10px] text-slate-500">{roster.filter(p => p.selected).length} Sel.</span></div><div className="h-60 overflow-y-auto bg-slate-900 rounded p-2 custom-scrollbar">{roster.map((p, i) => <div key={i} className="flex items-center gap-2 mb-1 hover:bg-slate-800 p-1 rounded"><button onClick={() => togglePlayer(i, activeTemplate === TEMPLATES.FORMACION)}>{p.selected ? <CheckSquare size={16} className="text-blue-500" /> : <Square size={16} className="text-slate-600" />}</button><input type="text" value={p.number} onChange={(e) => updatePlayerNumber(i, e.target.value)} className="w-8 bg-black text-center text-xs p-1 rounded text-blue-300 border-none font-talleres" /><div className="flex-1"><p className="text-xs font-bold text-white leading-none">{p.name}</p><p className="text-[10px] text-slate-500 leading-none mt-1">{p.pos}</p></div></div>)}</div></div>
                                        {activeTemplate === TEMPLATES.FORMACION && <div><label className="text-xs font-bold text-slate-400 mb-2 block">ORDENAR FORMACIÓN (Arrastrar)</label><div className="space-y-1 bg-slate-900 p-2 rounded">{data.formationList.map((p, i) => <div key={i} draggable onDragStart={(e) => onDragStart(e, i)} onDragOver={onDragOver} onDrop={(e) => onDrop(e, i)} className="flex items-center gap-2 bg-slate-800 p-2 rounded cursor-move hover:bg-slate-700 transition-colors"><GripVertical size={14} className="text-slate-500"/><span className="text-xs font-bold text-blue-400 w-6 font-talleres">{p.number}</span><span className="text-xs text-white">{p.name}</span></div>)}</div></div>}
                                    </div>
                                )}

                                {activeTemplate === TEMPLATES.NOTICIA_ESPECIAL && <div className="space-y-4"><input type="text" value={data.specialTitle} onChange={(e) => handleInputChange('specialTitle', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm font-bold" placeholder="TÍTULO GRANDE" /><textarea value={data.specialBody} onChange={(e) => handleInputChange('specialBody', e.target.value)} className="w-full h-64 bg-slate-900 p-2 rounded text-xs" placeholder="Escribe la noticia aquí..." /></div>}

                                {activeTemplate === TEMPLATES.NOTICIA_COMUN && <div className="space-y-4"><div className="flex items-center gap-2 mb-2"><button onClick={() => handleInputChange('newsShowTag', !data.newsShowTag)}>{data.newsShowTag ? <CheckSquare size={16} className="text-blue-500"/> : <Square size={16} className="text-slate-500"/>}</button><label className="text-xs text-slate-300">Mostrar Etiqueta</label></div>{data.newsShowTag && <div className="flex gap-2"><input type="text" value={data.newsTag} onChange={(e) => handleInputChange('newsTag', e.target.value)} className="flex-1 bg-slate-900 p-2 rounded text-sm text-center" placeholder="ETIQUETA" /><input type="color" value={data.newsTagColor} onChange={(e) => handleInputChange('newsTagColor', e.target.value)} className="w-10 h-full rounded cursor-pointer border-none bg-transparent" /></div>}<input type="text" value={data.newsTitle} onChange={(e) => handleInputChange('newsTitle', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm font-bold text-blue-300" placeholder="TITULAR" /><textarea value={data.newsSubtitle} onChange={(e) => handleInputChange('newsSubtitle', e.target.value)} className="w-full h-32 bg-slate-900 p-2 rounded text-sm" placeholder="Bajada de la noticia..." /></div>}


                                {activeTemplate === TEMPLATES.JUVENILES && (
                                    <div className="space-y-4">
                                        <div className="bg-slate-800 p-3 rounded border border-slate-600 space-y-2">
                                            <label className="text-xs font-bold text-blue-300">PLACA JUVENILES</label><p className="text-[10px] text-slate-400">Los nombres se muestran abreviados automáticamente en la placa.</p>
                                            <input type="text" value={data.results6Title} onChange={(e) => handleInputChange('results6Title', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm font-bold" placeholder="Título" />
                                            <input type="text" value={data.results6Subtitle} onChange={(e) => handleInputChange('results6Subtitle', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm" placeholder="Subtítulo" />
                                            <input type="text" value={data.results6Badge} onChange={(e) => handleInputChange('results6Badge', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm" placeholder="Texto cinta" />
                                            <button onClick={applyJuvenilesPreset} className="w-full bg-blue-600 hover:bg-blue-500 rounded py-2 text-xs font-bold">CARGAR ÚLTIMA FECHA JUVENILES</button>
                                        </div>
                                        <div className="space-y-2">
                                            {data.results6Rows.map((row, i) => (
                                                <div key={i} className="bg-slate-800 p-2 rounded border border-slate-700 space-y-2">
                                                    <div className="grid grid-cols-[1fr_70px] gap-2">
                                                        <input value={row.division} onChange={(e) => handleResults6RowChange(i, 'division', e.target.value)} className="bg-slate-900 p-1 rounded text-xs font-bold text-blue-300" placeholder="División" />
                                                        <input value={row.localia || ''} onChange={(e) => handleResults6RowChange(i, 'localia', e.target.value)} className="bg-slate-900 p-1 rounded text-xs text-center font-bold" placeholder="L/V" />
                                                    </div>
                                                    <div className="grid grid-cols-[1fr_auto_1fr] gap-2">
                                                        <input value={row.team1} onChange={(e) => handleResults6RowChange(i, 'team1', e.target.value)} className="bg-slate-900 p-1 rounded text-xs" placeholder="Equipo 1" />
                                                        <input value={row.score} onChange={(e) => handleResults6RowChange(i, 'score', e.target.value)} className="bg-slate-900 p-1 rounded text-xs text-center w-24" placeholder="0-0" />
                                                        <input value={row.team2} onChange={(e) => handleResults6RowChange(i, 'team2', e.target.value)} className="bg-slate-900 p-1 rounded text-xs" placeholder="Equipo 2" />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {activeTemplate === TEMPLATES.OTROS_RESULTADOS && (
                                    <div className="space-y-4">
                                        <div className="bg-slate-800 p-3 rounded border border-slate-600 space-y-2">
                                            <label className="text-xs font-bold text-blue-300">OTROS RESULTADOS</label><p className="text-[10px] text-slate-400">Podés pegar o subir una imagen para usarla de fondo en esta pieza.</p><select value={data.othersTournamentType} onChange={(e) => applyOthersPreset(e.target.value)} className="w-full bg-slate-900 p-2 rounded text-xs"><option value="reserva">Reserva</option><option value="femenino">Femenino</option><option value="otro">Otro</option></select>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => applyOthersPreset('reserva')} className="bg-blue-600 hover:bg-blue-500 rounded py-2 text-xs font-bold">CARGAR RESERVA</button>
                                                <button onClick={() => applyOthersPreset('femenino')} className="bg-slate-700 hover:bg-slate-600 rounded py-2 text-xs font-bold">CARGAR FEMENINO</button>
                                            </div>
                                            <input type="text" value={data.othersTitle} onChange={(e) => handleInputChange('othersTitle', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm font-bold" placeholder="Título" />
                                            <input type="text" value={data.othersSubtitle} onChange={(e) => handleInputChange('othersSubtitle', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm" placeholder="Subtítulo" />
                                            <input type="text" value={data.othersComp} onChange={(e) => handleInputChange('othersComp', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-sm" placeholder="Competencia" />
                                            <select value={data.othersLogoWhite ? 'white' : 'blue'} onChange={(e) => handleInputChange('othersLogoWhite', e.target.value === 'white')} className="w-full bg-slate-900 p-2 rounded text-xs"><option value="blue">Logo/Título azul oscuro</option><option value="white">Logo/Título blanco</option></select>
                                        </div>
                                        <div className="bg-slate-800 p-3 rounded border border-slate-600 space-y-2">
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" value={data.othersTeam1Name} onChange={(e) => handleInputChange('othersTeam1Name', e.target.value)} className="bg-slate-900 p-2 rounded text-xs" placeholder="Equipo 1" />
                                                <input type="text" value={data.othersTeam2Name} onChange={(e) => handleInputChange('othersTeam2Name', e.target.value)} className="bg-slate-900 p-2 rounded text-xs" placeholder="Equipo 2" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" value={data.othersScore1} onChange={(e) => handleInputChange('othersScore1', e.target.value)} className="bg-slate-900 p-2 rounded text-xs text-center font-bold font-talleres" placeholder="0" />
                                                <input type="text" value={data.othersScore2} onChange={(e) => handleInputChange('othersScore2', e.target.value)} className="bg-slate-900 p-2 rounded text-xs text-center font-bold font-talleres" placeholder="0" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 items-center">
                                                <div className="flex items-center gap-2"><span className="text-[10px] text-slate-400">Color 1</span><input type="color" value={data.othersColor1} onChange={(e) => handleInputChange('othersColor1', e.target.value)} className="w-8 h-8 bg-transparent border-none p-0" /></div>
                                                <div className="flex items-center gap-2"><span className="text-[10px] text-slate-400">Color 2</span><input type="color" value={data.othersColor2} onChange={(e) => handleInputChange('othersColor2', e.target.value)} className="w-8 h-8 bg-transparent border-none p-0" /></div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {(activeTemplate === TEMPLATES.HOY_JUEGA || activeTemplate === TEMPLATES.RESULTADO_FINAL) && (
                                    <div className="space-y-6">
                                        {activeTemplate === TEMPLATES.HOY_JUEGA && (
                                            <div className="bg-slate-800 p-2 rounded space-y-3 border border-slate-600 mb-4">
                                                <label className="text-[10px] font-bold text-blue-300">TEXTOS (HOY JUEGA)</label>
                                                <button onClick={applyNextMatchPreset} className="w-full bg-blue-600 hover:bg-blue-500 rounded py-2 text-[10px] font-bold">CARGAR PRÓXIMO PARTIDO</button>
                                                <div className="flex items-center gap-2 mt-1"><input type="text" value={data.hjTextLine1} onChange={(e) => handleInputChange('hjTextLine1', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-xs text-center font-bold" /><input type="color" value={data.hjTextColor1} onChange={(e) => handleInputChange('hjTextColor1', e.target.value)} className="w-6 h-6 rounded border-none p-0 cursor-pointer bg-transparent" /><button onClick={() => handleInputChange('hjTextHollow1', !data.hjTextHollow1)} className="bg-slate-700 text-[9px] p-1 rounded font-bold">{data.hjTextHollow1 ? 'HUECO' : 'SÓLIDO'}</button></div>
                                                <select value={data.hjTextBlendMode1} onChange={(e) => handleInputChange('hjTextBlendMode1', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-[10px]">{BLEND_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>Fusión HOY JUEGA: {opt.label}</option>)}</select>
                                                <div className="flex items-center gap-2 mt-1"><input type="text" value={data.hjTextLine2} onChange={(e) => handleInputChange('hjTextLine2', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-xs text-center font-bold" /><input type="color" value={data.hjTextColor2} onChange={(e) => handleInputChange('hjTextColor2', e.target.value)} className="w-6 h-6 rounded border-none p-0 cursor-pointer bg-transparent" /><button onClick={() => handleInputChange('hjTextHollow2', !data.hjTextHollow2)} className="bg-slate-700 text-[9px] p-1 rounded font-bold">{data.hjTextHollow2 ? 'HUECO' : 'SÓLIDO'}</button></div>
                                                <select value={data.hjTextBlendMode2} onChange={(e) => handleInputChange('hjTextBlendMode2', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-[10px]">{BLEND_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>Fusión TALLERES: {opt.label}</option>)}</select>
                                            </div>
                                        )}

                                        <div className="bg-slate-700/30 p-2 rounded space-y-2 mb-4 border border-slate-600"><label className="text-xs font-bold text-blue-300">Posición de Escudos/Cinta</label><div className="flex gap-2"><select value={data.hjLogosPosX} onChange={(e) => handleInputChange('hjLogosPosX', e.target.value)} className="w-full bg-slate-900 p-2 rounded text-xs text-center font-bold"><option value="right">Derecha</option><option value="left">Izquierda</option></select></div></div>
                                        <div className="bg-slate-800 p-2 rounded space-y-2 border border-slate-600"><label className="text-xs font-bold text-slate-400 flex justify-between items-center">INFO CENTRAL <Trophy size={12}/></label>{activeTemplate === TEMPLATES.RESULTADO_FINAL && <button onClick={applyLastFirstDivisionPreset} className="w-full bg-blue-600 hover:bg-blue-500 rounded py-2 text-[10px] font-bold">CARGAR ÚLTIMO RESULTADO</button>}<select className="w-full bg-slate-900 p-1 rounded text-[10px]" onChange={(e) => handleTournamentChange(e.target.value)}><option value="">Cambiar Torneo...</option>{LEAGUES_DB.map((l, i) => <option key={i} value={l.url}>{l.name}</option>)}</select>{activeTemplate === TEMPLATES.RESULTADO_FINAL && <div className="flex gap-2 mt-2"><input type="text" value={data.resScore1} onChange={(e) => handleInputChange('resScore1', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-lg text-center font-bold font-talleres" placeholder="Goles Eq 1" /><input type="text" value={data.resScore2} onChange={(e) => handleInputChange('resScore2', e.target.value)} className="w-1/2 bg-slate-900 p-1 rounded text-lg text-center font-bold font-talleres" placeholder="Goles Eq 2" /></div>}</div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-700/30 p-2 rounded space-y-2"><label className="text-[10px] font-bold text-blue-300 uppercase">EQUIPO 1 {activeTemplate === TEMPLATES.HOY_JUEGA || activeTemplate === TEMPLATES.RESULTADO_FINAL ? '(ARRIBA)' : ''}</label><select className="w-full bg-slate-900 p-1 rounded text-[10px]" onChange={(e) => handleTeamChange(1, e.target.value)}><option value="">Cambiar Escudo...</option>{TEAMS_DB.map((t, i) => <option key={i} value={t.url}>{t.name}</option>)}</select><div className="flex items-center justify-between gap-1 mt-1"><span className="text-[9px]">Grad:</span><input type="color" value={data.resColor1A} onChange={(e) => handleInputChange('resColor1A', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Superior" /><input type="color" value={data.resColor1B} onChange={(e) => handleInputChange('resColor1B', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Medio" /><input type="color" value={data.resColor1C} onChange={(e) => handleInputChange('resColor1C', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Inferior" /></div>{activeTemplate !== TEMPLATES.HOY_JUEGA && <input type="text" value={data.resTeam1Name} onChange={(e) => handleInputChange('resTeam1Name', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-xs font-bold uppercase mt-2" placeholder="Nombre" />}</div>
                                            <div className="bg-slate-700/30 p-2 rounded space-y-2"><label className="text-[10px] font-bold text-red-300 uppercase">EQUIPO 2 {activeTemplate === TEMPLATES.HOY_JUEGA || activeTemplate === TEMPLATES.RESULTADO_FINAL ? '(ABAJO)' : ''}</label><select className="w-full bg-slate-900 p-1 rounded text-[10px]" onChange={(e) => handleTeamChange(2, e.target.value)}><option value="">Cambiar Escudo...</option>{TEAMS_DB.map((t, i) => <option key={i} value={t.url}>{t.name}</option>)}</select><div className="flex items-center justify-between gap-1 mt-1"><span className="text-[9px]">Grad:</span><input type="color" value={data.resColor2A} onChange={(e) => handleInputChange('resColor2A', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Superior" /><input type="color" value={data.resColor2B} onChange={(e) => handleInputChange('resColor2B', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Medio" /><input type="color" value={data.resColor2C} onChange={(e) => handleInputChange('resColor2C', e.target.value)} className="w-5 h-6 rounded cursor-pointer bg-transparent border-none p-0" title="Color Inferior" /></div>{activeTemplate !== TEMPLATES.HOY_JUEGA && <input type="text" value={data.resTeam2Name} onChange={(e) => handleInputChange('resTeam2Name', e.target.value)} className="w-full bg-slate-900 p-1 rounded text-xs font-bold uppercase mt-2" placeholder="Nombre" />}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <div ref={containerRef} className={`flex-1 flex items-center justify-center relative transition-all duration-300 ${isPreviewMode ? 'fixed inset-0 z-50 bg-black' : 'bg-slate-950/50 p-2 md:p-4 overflow-auto'}`} onPaste={handleGlobalPaste} tabIndex="0">
                        <div className="absolute top-4 right-4 z-50 flex gap-2"><button onClick={() => setIsPreviewMode(!isPreviewMode)} className="bg-black/50 hover:bg-blue-600 text-white p-3 rounded-full backdrop-blur-md transition-all shadow-lg border border-white/20">{isPreviewMode ? <Minimize2 size={24} /> : <Eye size={24} />}</button></div>
                        <div ref={wrapperRef} style={{ transform: isPreviewMode ? `scale(${Math.min(window.innerWidth / 1080, window.innerHeight / 1350) * 0.9})` : `scale(${previewScale})`, transformOrigin: 'center' }} className="shadow-2xl">
                            <div ref={canvasRef} style={{ width: '1080px', height: '1350px', backgroundColor: THEME.bg }} className="overflow-hidden shadow-2xl relative bg-[#021024]">{renderActiveTemplate()}</div>
                        </div>
                        {!isPreviewMode && <button onClick={handleDownload} disabled={loading} className="absolute bottom-6 right-6 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 z-30 transition-transform hover:scale-105 active:scale-95">{loading ? 'PROCESANDO...' : <><Download size={20} /> DESCARGAR HD</>}</button>}
                        {isPreviewMode && <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex gap-4 z-50"><button onClick={handleDownload} disabled={loading} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-full font-bold shadow-2xl flex items-center gap-3 transition-transform hover:scale-105 active:scale-95 border-2 border-white/20">{loading ? 'GENERANDO...' : <><Save size={24} /> GUARDAR IMAGEN</>}</button></div>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
